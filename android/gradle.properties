org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Reaproveita o que já foi compilado e roda tarefas em paralelo: os builds a
# partir do segundo ficam bem mais rápidos.
org.gradle.caching=true
org.gradle.parallel=true
